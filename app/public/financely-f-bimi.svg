<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps"
     viewBox="0 0 100 100" width="100" height="100">
  <title>Financely</title>
  <!-- Solid white background (required by BIMI spec — no transparency) -->
  <rect width="100" height="100" fill="#ffffff"/>
  <!-- F — vertical stem -->
  <rect x="10" y="9" width="15" height="74" fill="#166534"/>
  <!-- F — top horizontal bar -->
  <rect x="10" y="9" width="60" height="15" fill="#166534"/>
  <!-- F — middle crossbar -->
  <rect x="10" y="39" width="42" height="13" fill="#166534"/>
  <!-- Green dot -->
  <circle cx="80" cy="81" r="11" fill="#22c55e"/>
</svg>
